<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator </title>
</head>
<body>
    <center>
        <h1 style="color:blue;">Simple Interest Calculator</h1>
        <form method="POST">
            <input type="number" step="any" name="p" id="" placeholder="Principal Amount">
            <input type="number" step="any" name="r" id="" placeholder="Rate">
            <input type="number" step="any" name="t" id="" placeholder="Time">
            <button type="submit" > Calculate Interest</button>    
        </form>
    </center>
    {# Display output#}
    {% if result %}
          <hr>
          <h3>Result,</h3>
            <span>Principal:{{ p }}</span><br>
            <span>Rate:{{ r }}</span><br>
            <span>Time:{{ t }}</span><br>
            <span>
                <b>Simple Interest: {{ result }}</b><br>
                <b>Total Amount: {{ total }}</b>
            </span>
    {% endif %}
    
</body>
</html>
